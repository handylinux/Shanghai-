<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f172a">
<title>Шанхай · навигатор</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
  :root{
    --bg:#f4f5f7; --card:#ffffff; --ink:#0f172a; --muted:#64748b;
    --line:#e2e8f0; --accent:#2563eb; --accent2:#0ea5e9;
    --ok:#16a34a; --warn:#b45309;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
  html,body{margin:0; padding:0; background:var(--bg); color:var(--ink);
    font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
  body{padding-bottom:64px}
  .wrap{max-width:560px; margin:0 auto; padding:0 14px}
  header{position:sticky; top:0; z-index:20; background:linear-gradient(135deg,#0f172a,#1e3a8a);
    color:#fff; padding:16px 14px 14px; box-shadow:0 2px 10px rgba(0,0,0,.15)}
  header h1{margin:0; font-size:19px; font-weight:700}
  header .sub{margin-top:2px; font-size:12.5px; opacity:.85}
  header .prog{margin-top:10px; font-size:12px; opacity:.9}
  .progbar{height:6px; border-radius:3px; background:rgba(255,255,255,.18); overflow:hidden; margin-top:6px}
  .progbar i{display:block; height:100%; background:#38bdf8; border-radius:3px; transition:width .3s}
  nav{position:fixed; bottom:0; left:0; right:0; z-index:30; display:flex; background:#fff;
    border-top:1px solid var(--line); box-shadow:0 -2px 10px rgba(0,0,0,.06)}
  nav button{flex:1; border:0; background:none; padding:10px 4px 8px; font-size:11px; color:var(--muted);
    display:flex; flex-direction:column; align-items:center; gap:3px; cursor:pointer}
  nav button .ic{font-size:20px; line-height:1}
  nav button.active{color:var(--accent); font-weight:600}
  .view{display:none; padding:16px 0 8px}
  .view.on{display:block}
  h2.sec{margin:4px 0 12px; font-size:17px}
  .card{background:var(--card); border:1px solid var(--line); border-radius:14px; padding:13px 14px;
    margin-bottom:10px; box-shadow:0 1px 2px rgba(0,0,0,.04)}
  .loc{display:flex; gap:12px; align-items:flex-start}
  .loc .em{font-size:26px; line-height:1; width:34px; text-align:center; flex:none}
  .loc .bd{flex:1; min-width:0}
  .loc .nm{font-weight:600; font-size:14.5px}
  .loc .zh{color:var(--muted); font-size:12px; margin-top:1px}
  .loc .mt{font-size:12.5px; color:var(--muted); margin-top:5px}
  .loc .row{display:flex; flex-wrap:wrap; gap:6px; margin-top:7px}
  .chip{font-size:11px; padding:3px 8px; border-radius:99px; background:#f1f5f9; color:#334155; white-space:nowrap}
  .chip.cost{background:#eef2ff; color:#3730a3; font-weight:600}
  .chip.day{background:#ecfdf5; color:#065f46}
  .chip.visited{background:#e6f4ea; color:#15803d}
  .loc.done{opacity:.45}
  .loc.done .nm{text-decoration:line-through}
  .badge-done{background:var(--ok); color:#fff; border-radius:99px; font-size:10px; padding:1px 7px; font-weight:700}
  .btn{display:inline-flex; align-items:center; gap:6px; border:0; border-radius:10px; padding:9px 13px;
    font-size:13.5px; font-weight:600; cursor:pointer; background:var(--accent); color:#fff}
  .btn.ghost{background:#eef2ff; color:#3730a3}
  .btn.sm{padding:7px 10px; font-size:12.5px}
  .daycard{display:flex; align-items:center; gap:12px; cursor:pointer}
  .daycard .num{width:40px; height:40px; border-radius:12px; background:linear-gradient(135deg,var(--accent),var(--accent2));
    color:#fff; display:flex; align-items:center; justify-content:center; font-weight:800; font-size:16px; flex:none}
  .daycard .tt{font-weight:600; font-size:14.5px}
  .daycard .cnt{font-size:12px; color:var(--muted); margin-top:2px}
  .daycard .chev{margin-left:auto; color:var(--muted)}
  .search{width:100%; border:1px solid var(--line); border-radius:12px; padding:11px 13px; font-size:14px;
    margin-bottom:12px; background:#fff}
  .filters{display:flex; gap:8px; overflow-x:auto; padding-bottom:8px; margin-bottom:6px}
  .filters button{flex:none; border:1px solid var(--line); background:#fff; border-radius:99px; padding:7px 13px;
    font-size:12.5px; cursor:pointer; color:#334155}
  .filters button.on{background:var(--accent); color:#fff; border-color:var(--accent)}
  .steps{list-style:none; padding:0; margin:0}
  .steps li{position:relative; padding:0 0 16px 30px}
  .steps li:before{content:""; position:absolute; left:10px; top:6px; bottom:-2px; width:2px; background:var(--line)}
  .steps li:last-child:before{display:none}
  .steps .dot{position:absolute; left:2px; top:2px; width:18px; height:18px; border-radius:50%;
    background:var(--accent); color:#fff; font-size:11px; font-weight:700; display:flex; align-items:center; justify-content:center}
  .note{background:#fffbeb; border:1px solid #fde68a; color:#92400e; border-radius:12px; padding:11px 13px; font-size:13px; margin:10px 0}
  #map{height:60vh; border-radius:14px; border:1px solid var(--line); margin-bottom:12px}
  .leaflet-popup-content{font:13px/1.4 -apple-system,Segoe UI,Roboto,sans-serif}
  /* modal */
  .overlay{position:fixed; inset:0; background:rgba(15,23,42,.5); z-index:40; display:none; align-items:flex-end; justify-content:center}
  .overlay.on{display:flex}
  .sheet{background:#fff; width:100%; max-width:560px; max-height:92vh; overflow-y:auto; border-radius:20px 20px 0 0;
    padding:18px 16px 28px; animation:up .25s ease}
  @keyframes up{from{transform:translateY(40px); opacity:0} to{transform:none; opacity:1}}
  .sheet .hero{font-size:44px; text-align:center; margin:4px 0 10px}
  .sheet .hero img{max-width:100%; border-radius:14px; display:block; margin:0 auto}
  .sheet h3{margin:0 0 2px; font-size:19px}
  .sheet .zh{color:var(--muted); font-size:13px}
  .sheet .kv{margin:14px 0}
  .sheet .kv .k{font-size:12px; color:var(--muted); text-transform:uppercase; letter-spacing:.4px; margin-top:10px}
  .sheet .kv .v{font-size:14.5px; margin-top:2px}
  .sheet .actions{display:flex; flex-wrap:wrap; gap:8px; margin-top:16px}
  .close{position:sticky; top:0; float:right; background:#f1f5f9; border:0; border-radius:99px; width:34px; height:34px;
    font-size:16px; cursor:pointer}
  .near{margin-top:14px}
  .near h4{margin:0 0 8px; font-size:13px; color:var(--muted); text-transform:uppercase; letter-spacing:.4px}
  .near .item{display:flex; align-items:center; gap:10px; padding:9px 11px; border:1px solid var(--line); border-radius:11px;
    margin-bottom:7px; cursor:pointer; background:#fafbfc}
  .near .item .em{font-size:20px}
  .near .item .nm{font-size:13.5px; font-weight:500}
  .near .item .dist{margin-left:auto; font-size:11.5px; color:var(--muted)}
  .muted{color:var(--muted)}
  .mt8{margin-top:8px}
</style>
</head>
<body>
<header>
  <h1>🗺️ Шанхай · навигатор</h1>
  <div class="sub" id="tripSub">—</div>
  <div class="prog" id="progLine"></div>
  <div class="progbar"><i id="progFill"></i></div>
</header>

<div class="wrap">
  <div class="view on" id="view-arrival"></div>
  <div class="view" id="view-days"></div>
  <div class="view" id="view-places"></div>
  <div class="view" id="view-map"></div>
</div>

<nav>
  <button data-v="arrival" class="active"><span class="ic">🛬</span>Прилёт</button>
  <button data-v="days"><span class="ic">📅</span>Дни</button>
  <button data-v="places"><span class="ic">📍</span>Места</button>
  <button data-v="map"><span class="ic">🗺️</span>Карта</button>
</nav>

<div class="overlay" id="overlay"><div class="sheet" id="sheet"></div></div>

<script src="data.js"></script>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="app.js"></script>
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('./sw.js').catch(err => {
        console.warn('SW registration failed:', err);
      });
    });
  }
</script>
</body>
</html>
